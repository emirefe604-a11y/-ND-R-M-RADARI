name: APK Derle
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android iskeletini oluştur
        run: flutter create --platforms=android --org com.indirimradari --project-name indirim_radari .
      - name: Android ayarlarını yamala
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: Uygulama ikonunu üret
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: indirim-radari-apk
          path: build/app/outputs/flutter-apk/app-release.apk
