name: APK Derle
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje klasörünü bul (alt klasördeyse köke taşı)
        run: |
          P=$(find . -name pubspec.yaml -not -path './.git/*' -not -path './build/*' | head -1)
          if [ -z "$P" ]; then
            echo "pubspec.yaml reponun hiçbir yerinde bulunamadı. Repo içeriği:"
            find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          D=$(dirname "$P")
          echo "Proje klasörü: $D"
          if [ "$D" != "." ]; then cp -a "$D"/. .; fi

      - name: Gerekli dosyalar var mı?
        run: |
          for f in pubspec.yaml lib/main.dart assets/icon.png assets/icon_fg.png assets/ic_stat.png; do
            test -f "$f" || { echo "EKSİK DOSYA: $f (repoya yüklemeyi unutmuşsunuz)"; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android iskeletini oluştur
        run: flutter create --platforms=android --org com.indirimradari --project-name indirim_radari .

      - name: Android ayarlarını yamala
        run: |
          python3 - <<'PY'
          import pathlib, re, shutil
          app = pathlib.Path('android/app')

          # Manifest: izinler + uygulama adı
          m = app / 'src/main/AndroidManifest.xml'
          t = m.read_text(encoding='utf-8')
          perms = ('    <uses-permission android:name="android.permission.INTERNET"/>\n'
                   '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                   '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n')
          t = t.replace('<application', perms + '    <application', 1)
          t = re.sub(r'android:label="[^"]*"', 'android:label="İndirim Radarı"', t, count=1)
          m.write_text(t, encoding='utf-8')

          # Bildirim küçük ikonu
          d = app / 'src/main/res/drawable'
          d.mkdir(parents=True, exist_ok=True)
          shutil.copy('assets/ic_stat.png', d / 'ic_stat.png')

          # flutter_local_notifications için core library desugaring
          for name in ('build.gradle.kts', 'build.gradle'):
              g = app / name
              if not g.exists():
                  continue
              s = g.read_text(encoding='utf-8')
              if name.endswith('.kts'):
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              g.write_text(s, encoding='utf-8')
              break
          print('Android yamaları uygulandı')
          PY

      - run: flutter pub get

      - name: Uygulama ikonunu üret
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: indirim-radari-apk
          path: build/app/outputs/flutter-apk/app-release.apk
